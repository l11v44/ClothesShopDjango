{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto py-20 text-center">
    <h2 class="text-2xl font-bold mb-6">Are you sure you want to log out?</h2>
    <form method="POST" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 text-white px-8 py-3 rounded-full font-bold hover:bg-red-700 transition">
            Yes, Log out
        </button>
        <a href="{% url 'profile' %}" class="block mt-4 text-gray-500 hover:text-gray-900">Cancel</a>
    </form>
</div>
{% endblock %}
