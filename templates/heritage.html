{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="bg-black text-white min-h-screen py-20">
    <section class="max-w-5xl mx-auto px-4 text-center mb-32">
        <span class="text-yellow-600 tracking-[0.5em] uppercase text-xs font-bold" data-aos="fade-down">Est. 1960</span>
        <h1 class="text-7xl md:text-9xl font-black mt-6 mb-8 text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 via-yellow-500 to-yellow-700" data-aos="zoom-out">HERITAGE</h1>
        <p class="text-xl text-gray-400 italic font-light max-w-xl mx-auto" data-aos="fade-up" data-aos-delay="300">
            "True luxury is not just seen, it's felt in every detail of the creation process."
        </p>
    </section>

    <div class="max-w-4xl mx-auto px-4 relative">
        <div class="absolute left-4 md:left-1/2 top-0 bottom-0 w-px bg-gradient-to-b from-yellow-500 via-yellow-700 to-transparent"></div>

        {% for item in milestones %}
        <div class="relative pl-12 md:pl-0 mb-20" data-aos="fade-up">
            <div class="absolute left-0 md:left-1/2 -translate-x-1/2 w-8 h-8 rounded-full border-4 border-black bg-yellow-600 shadow-[0_0_20px_rgba(202,138,4,0.5)] z-10"></div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
                <div class="{% if forloop.counter|divisibleby:2 %}md:order-2{% else %}md:text-right{% endif %}">
                    <h2 class="text-5xl font-black text-yellow-600 mb-2">{{ item.year }}</h2>
                    <h3 class="text-2xl font-bold uppercase tracking-widest text-white mb-4">{{ item.title }}</h3>
                </div>
                <div class="bg-gray-900/50 p-8 rounded-3xl border border-yellow-900/30 hover:border-yellow-600/50 transition-all duration-500 group">
                    <p class="text-gray-400 leading-relaxed group-hover:text-gray-200 transition-colors">
                        {{ item.desc }}
                    </p>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <section class="mt-32 text-center" data-aos="fade-up">
        <a href="{% url 'catalog' %}" class="inline-block px-12 py-5 border border-yellow-600 text-yellow-600 font-black text-sm uppercase tracking-[0.3em] hover:bg-yellow-600 hover:text-black transition-all duration-500 hover:shadow-[0_0_40px_rgba(202,138,4,0.3)]">
            Explore Collection
        </a>
    </section>
</div>

<style>
    /* Плавные переходы для блоков */
    .grid {
        transition: transform 0.5s ease;
    }
    
    /* Эффект свечения для текста заголовка */
    h1 {
        text-shadow: 0 0 30px rgba(202, 138, 4, 0.3);
    }
</style>
{% endblock %}
