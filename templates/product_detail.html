{% extends 'base.html' %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 py-12">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-12">

        <div class="bg-gray-100 rounded-2xl p-6 flex items-center justify-center">
            {% if product.image %}
                <img src="{{ product.image.url }}" alt="{{ product.name }}"
                     class="max-h-96 object-contain rounded-xl">
            {% else %}
                <div class="h-64 w-full flex items-center justify-center text-gray-400">No Image</div>
            {% endif %}
        </div>

        <div>
            <h1 class="text-4xl font-bold text-gray-900">{{ product.name }}</h1>
            <p class="text-2xl font-bold text-indigo-600 mt-4">{{ product.price }} $</p>

            <div class="mt-6 text-gray-600 leading-relaxed">
                <h3 class="font-bold text-gray-900">Description:</h3>
                <p>{{ product.description }}</p>
            </div>

            <div class="mt-8">
                <form action="" method="POST" id="add-to-cart-form">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700">Select Size & Color:</label>
                        <select name="variant_id" id="variant_select" onchange="checkSelection()"
                                class="mt-1 block w-full p-2 border border-gray-300 rounded-md focus:ring-indigo-500 focus:border-indigo-500">
                            <option value="">-- Choose an option --</option>
                            {% for variant in product.variants.all %}
                                <option value="{{ variant.id }}" {% if variant.stock <= 0 %}disabled{% endif %}>
                                    {{ variant.size }} - {{ variant.color }} {% if variant.stock <= 0 %}(Out of stock){% endif %}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <button type="submit" id="add-button" disabled
                            class="bg-indigo-600 text-white px-8 py-3 rounded-lg hover:bg-indigo-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed">
                        Add to Cart
                    </button>
                </form>

                <a href="{% url 'catalog' %}" class="ml-4 text-gray-600 hover:text-gray-900 underline">Back to Catalog</a>
            </div>
        </div>
    </div>
</div>

<script>
    function checkSelection() {
        const select = document.getElementById('variant_select');
        const form = document.getElementById('add-to-cart-form');
        const button = document.getElementById('add-button');

        if (select.value !== "") {
            // Устанавливаем action формы на нужный URL
            form.action = '/cart/add/' + select.value + '/';
            button.disabled = false;
        } else {
            button.disabled = true;
        }
    }
</script>
{% endblock %}
