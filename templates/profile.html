{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto py-16 px-4">
    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 p-8 md:p-12">
        <h1 class="text-3xl font-bold mb-8">My Profile</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="space-y-4">
                <h3 class="text-lg font-semibold text-gray-500">Account Details</h3>
                <p><strong class="text-gray-900">Username:</strong> {{ user.username }}</p>
                <p><strong class="text-gray-900">Email:</strong> {{ user.email }}</p>
            </div>
            
            <div class="space-y-4">
                <h3 class="text-lg font-semibold text-gray-500">Actions</h3>
                <a href="{% url 'logout' %}" class="inline-block bg-red-50 text-red-600 px-6 py-2 rounded-full font-semibold hover:bg-red-100 transition">
                    Logout
                </a>
            </div>
        </div>

        <div class="mt-12 pt-12 border-t border-gray-100">
            <h3 class="text-2xl font-bold mb-6">Order History</h3>
            <p class="text-gray-500">You haven't placed any orders yet.</p>
        </div>
    </div>
</div>
{% endblock %}
